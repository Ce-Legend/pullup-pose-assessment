[project]
name = "pullup-pose-assessment"
version = "0.1.0"
description = "Flask and MediaPipe based pull-up video assessment workflow."
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "flask-cors>=6.0,<7",
  "numpy>=2.0,<3",
  "Pillow>=11.0,<12",
  "scipy>=1.12,<2",
  "opencv-python>=4.9,<5",
  "mediapipe>=0.10,<0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
