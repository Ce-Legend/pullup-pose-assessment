<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>上传｜引体向上识别</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
    <!-- Preload fonts if possible, or use system fonts as fallback which is already set -->
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div>
          <div class="title">引体向上动作分析系统</div>
          <div class="muted">
            <span style="color: var(--accent)">●</span> 在线
            <span style="margin: 0 8px; opacity: 0.3">|</span>
            {{ user.display_name }} <span class="mono" style="opacity: 0.7">({{ user.role }})</span>
          </div>
        </div>
        <div class="actions">
          {% if user.role == 'teacher' %}
          <a class="link" href="{{ url_for('standards_page') }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: text-bottom; margin-right: 4px">
              <path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
              <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            标准视频
          </a>
          {% endif %}
          <a class="link" href="{{ url_for('history') }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: text-bottom; margin-right: 4px">
              <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            历史记录
          </a>
          <form method="post" action="{{ url_for('logout') }}" style="margin: 0">
            <button class="ghost" type="submit">退出</button>
          </form>
        </div>
      </div>

      <div class="card">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          拍摄指南
        </h2>
        <div class="tips-grid">
          <div class="tip-item">
            <div class="tip-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="tip-text">确保画面中仅有<strong>单人</strong></div>
          </div>
          <div class="tip-item">
            <div class="tip-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </div>
            <div class="tip-text">使用<strong>固定机位</strong>，避免晃动</div>
          </div>
          <div class="tip-item">
            <div class="tip-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
            <div class="tip-text">支持<strong>正面/侧面/斜侧面</strong>拍摄</div>
          </div>
          <div class="tip-item">
            <div class="tip-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 3l14 9-14 9V3z"></path> <!-- Play symbol acting as frame/action -->
              </svg>
            </div>
            <div class="tip-text"><strong>全身入镜</strong>，无遮挡且光线充足</div>
          </div>
          <div class="tip-item">
            <div class="tip-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            <div class="tip-text">视频长度 <strong>不限</strong>（建议单次动作，MP4格式）</div>
          </div>
          <div class="tip-item">
            <div class="tip-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"></path>
              </svg>
            </div>
            <div class="tip-text">只录制 <strong>1 次</strong> 完整标准动作</div>
          </div>
        </div>
      </div>

      <div class="card" style="border-top: 4px solid var(--accent)">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          上传视频
        </h2>
        <form id="uploadForm">
          <div class="form-grid">
            <div>
               <label>拍摄视角</label>
               <select name="view" id="viewSelect" required>
                  <option value="front" {% if view_default == 'front' %}selected{% endif %}>正面视角</option>
                  <option value="side" {% if view_default == 'side' %}selected{% endif %}>侧面视角</option>
                  <option value="angle" {% if view_default == 'angle' %}selected{% endif %}>斜侧面视角 (45°)</option>
               </select>
            </div>
            <div>
               <label>对比模式</label>
               <select name="compare_mode" id="compareModeSelect" required>
                  <option value="standard" selected>与标准动作对比</option>
                  <option value="history">与我的历史动作对比</option>
               </select>
            </div>
          </div>
          
          <!-- 历史对比选择区域（默认隐藏） -->
          <div id="historySelectArea" style="display: none; margin-bottom: 24px; animation: fadeIn 0.3s ease-out;">
            <label>选择历史动作</label>
            <select name="compare_analysis_id" id="historySelect">
              <option value="">加载中...</option>
            </select>
            <p class="muted" style="margin-top: 8px; font-size: 13px; display: flex; align-items: center; gap: 6px;">
               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                 <path d="M12 20v-6M6 20V10M18 20V4"></path>
               </svg>
               选择一个已完成的历史分析，新视频将与该动作进行对比
            </p>
          </div>
          
          <label>视频文件</label>
          <div class="upload-zone" id="dropZone">
            <input type="file" name="file" accept="video/mp4" required id="fileInput" />
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div class="upload-title">点击或拖拽上传视频</div>
            <div class="muted">支持 MP4 格式，最大 50MB</div>
            <div id="fileName" style="margin-top: 10px; color: var(--accent); font-size: 14px; font-weight: 500;"></div>
          </div>

          <button type="submit" style="margin-top: 24px;">
            开始智能分析
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="vertical-align: -2px; margin-left: 6px">
              <path d="M5 12h14M12 5l7 7-7 7"></path>
            </svg>
          </button>
          <div id="uploadError" class="alert" style="display: none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
               <circle cx="12" cy="12" r="10"></circle>
               <line x1="12" y1="8" x2="12" y2="12"></line>
               <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span class="msg"></span>
          </div>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById("uploadForm");
      const fileInput = document.getElementById("fileInput");
      const fileNameDisplay = document.getElementById("fileName");
      const errBox = document.getElementById("uploadError");
      const errMsg = errBox.querySelector(".msg");
      const compareModeSelect = document.getElementById("compareModeSelect");
      const historySelectArea = document.getElementById("historySelectArea");
      const historySelect = document.getElementById("historySelect");
      const viewSelect = document.getElementById("viewSelect");
      
      let historyLoaded = false;
      let historyData = [];

      // 加载用户历史分析列表
      async function loadHistoryList() {
        if (historyLoaded) return;
        try {
          const res = await fetch("/api/my-analyses?status=succeeded", { credentials: "include" });
          const data = await res.json();
          historyData = data.items || [];
          updateHistoryOptions();
          historyLoaded = true;
        } catch (err) {
          historySelect.innerHTML = '<option value="">加载失败</option>';
        }
      }

      // 更新历史选项（根据当前视角过滤）
      function updateHistoryOptions() {
        const currentView = viewSelect.value;
        const filtered = historyData.filter(item => item.view === currentView);
        
        if (filtered.length === 0) {
          historySelect.innerHTML = '<option value="">暂无该视角的历史记录</option>';
          return;
        }
        
        historySelect.innerHTML = filtered.map(item => {
          const date = new Date(item.created_at).toLocaleString('zh-CN', {
            month: 'numeric', day: 'numeric', 
            hour: '2-digit', minute: '2-digit'
          });
          const score = item.score_total ? `${item.score_total}分` : '无评分';
          return `<option value="${item.id}">${date} - ${score}</option>`;
        }).join('');
      }

      // 对比模式切换
      compareModeSelect.addEventListener("change", async () => {
        const mode = compareModeSelect.value;
        if (mode === "history") {
          historySelectArea.style.display = "block";
          await loadHistoryList();
          updateHistoryOptions();
        } else {
          historySelectArea.style.display = "none";
        }
      });

      // 视角切换时更新历史列表
      viewSelect.addEventListener("change", () => {
        if (compareModeSelect.value === "history" && historyLoaded) {
          updateHistoryOptions();
        }
      });

      // File input change handler for better UX
      fileInput.addEventListener("change", (e) => {
        if (fileInput.files.length > 0) {
          fileNameDisplay.textContent = "已选择: " + fileInput.files[0].name;
          fileNameDisplay.style.display = "block";
        } else {
          fileNameDisplay.style.display = "none";
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.style.display = "none";
        
        // Basic validation
        if (fileInput.files.length === 0) {
            errMsg.textContent = "请先选择一个视频文件";
            errBox.style.display = "flex";
            return;
        }

        // 历史对比模式校验
        if (compareModeSelect.value === "history") {
          if (!historySelect.value) {
            errMsg.textContent = "请选择一个历史动作进行对比";
            errBox.style.display = "flex";
            return;
          }
        }

        const btn = form.querySelector("button[type='submit']");
        const originalBtnText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '正在上传并分析 <span class="mono">...</span>';

        const fd = new FormData(form);
        try {
            const res = await fetch("/api/analyses", { method: "POST", body: fd, credentials: "include" });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              errMsg.textContent = data.error_message || "提交失败，请重试";
              errBox.style.display = "flex";
              btn.disabled = false;
              btn.innerHTML = originalBtnText;
              return;
            }
            // Success
            location.href = `/result/${data.analysis_id}`;
        } catch (err) {
            errMsg.textContent = "网络错误，请检查连接";
            errBox.style.display = "flex";
            btn.disabled = false;
            btn.innerHTML = originalBtnText;
        }
      });
    </script>
  </body>
</html>
