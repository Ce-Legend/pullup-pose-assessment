<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录｜引体向上识别</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  </head>
  <body>
    <div class="container">
      <h1>引体向上动作分析系统</h1>
      <p class="muted">支持正面、侧面、斜侧面多视角分析</p>

      <div class="card">
        <h2>登录</h2>
        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}
        <form method="post">
          <label>
            账号
            <input name="username" autocomplete="username" required />
          </label>
          <label>
            密码
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">登录</button>
        </form>
        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(154, 166, 209, 0.2);">
          <p class="muted" style="margin-bottom: 12px;">还没有账号？</p>
          <a href="{{ url_for('register') }}" class="link" style="font-size: 15px;">
            📝 学生注册
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
