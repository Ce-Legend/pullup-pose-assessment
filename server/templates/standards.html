<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>标准视频管理｜引体向上识别</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
    <style>
      .standards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .standard-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 16px;
        position: relative;
      }
      .standard-card.active {
        border-color: #6effc6;
        box-shadow: 0 0 20px rgba(110, 255, 198, 0.1);
      }
      .standard-card video {
        width: 100%;
        border-radius: 8px;
        margin-bottom: 12px;
        background: #1a1f2e;
        min-height: 180px;
      }
      .standard-card video::-webkit-media-controls-panel {
        background: linear-gradient(transparent, rgba(0,0,0,0.7));
      }
      .standard-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .standard-name {
        font-size: 1.1em;
        font-weight: 600;
        color: #e7ecff;
      }
      .standard-meta {
        font-size: 0.85em;
        color: #9aa6d1;
      }
      .standard-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.75em;
        font-weight: 600;
      }
      .badge-front { background: #6effc6; color: #0a0e1a; }
      .badge-side { background: #6ec6ff; color: #0a0e1a; }
      .badge-angle { background: #ffe066; color: #0a0e1a; }
      .badge-active { background: #6effc6; color: #0a0e1a; margin-left: 8px; }
      .standard-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .standard-actions button {
        flex: 1;
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 0.9em;
        transition: all 0.2s;
      }
      .btn-activate {
        background: rgba(110, 255, 198, 0.2);
        color: #6effc6;
      }
      .btn-activate:hover {
        background: rgba(110, 255, 198, 0.3);
      }
      .btn-activate:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-delete {
        background: rgba(255, 106, 122, 0.2);
        color: #ff6a7a;
      }
      .btn-delete:hover {
        background: rgba(255, 106, 122, 0.3);
      }
      .upload-section {
        background: rgba(255,255,255,0.03);
        border: 2px dashed rgba(255,255,255,0.2);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        margin-bottom: 24px;
      }
      .upload-section h3 {
        margin-bottom: 16px;
        color: #e7ecff;
      }
      .upload-form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        align-items: center;
      }
      .upload-form select, .upload-form input[type="text"] {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05);
        color: #e7ecff;
        font-size: 1em;
      }
      .upload-form input[type="file"] {
        display: none;
      }
      .upload-form label.file-label {
        padding: 10px 20px;
        border-radius: 8px;
        background: rgba(110, 198, 255, 0.2);
        color: #6ec6ff;
        cursor: pointer;
        transition: all 0.2s;
      }
      .upload-form label.file-label:hover {
        background: rgba(110, 198, 255, 0.3);
      }
      .upload-form button[type="submit"] {
        padding: 10px 24px;
        border-radius: 8px;
        border: none;
        background: #6effc6;
        color: #0a0e1a;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .upload-form button[type="submit"]:hover {
        background: #5de6b0;
      }
      .upload-form button[type="submit"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .file-name {
        color: #9aa6d1;
        font-size: 0.9em;
      }
      .view-section {
        margin-top: 32px;
      }
      .view-section h3 {
        color: #e7ecff;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .empty-state {
        text-align: center;
        padding: 40px;
        color: #9aa6d1;
      }
      .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .alert-success {
        background: rgba(110, 255, 198, 0.1);
        color: #6effc6;
        border: 1px solid rgba(110, 255, 198, 0.3);
      }
      .alert-error {
        background: rgba(255, 106, 122, 0.1);
        color: #ff6a7a;
        border: 1px solid rgba(255, 106, 122, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div>
          <div class="title">标准视频管理</div>
          <div class="muted">配置不同视角的标准动作视频</div>
        </div>
        <div class="actions">
          <a class="link" href="{{ url_for('upload') }}">上传分析</a>
          <a class="link" href="{{ url_for('history') }}">历史记录</a>
          <form method="post" action="{{ url_for('logout') }}">
            <button class="ghost" type="submit">退出</button>
          </form>
        </div>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <div class="upload-section">
        <h3>上传新标准视频</h3>
        <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
          <select name="view_angle" id="viewAngle">
            <option value="front">正面视角</option>
            <option value="side">侧面视角</option>
            <option value="angle">斜侧面(45°)</option>
          </select>
          <input type="text" name="name" id="videoName" placeholder="视频名称（可选）" />
          <input type="file" name="file" id="videoFile" accept=".mp4,video/mp4" />
          <label for="videoFile" class="file-label">选择视频</label>
          <span id="fileName" class="file-name">未选择文件</span>
          <button type="submit" id="uploadBtn" disabled>上传</button>
        </form>
      </div>

      <div id="standardsList">
        <div class="view-section" id="section-front">
          <h3><span class="standard-badge badge-front">正面</span> 标准视频</h3>
          <div class="standards-grid" id="grid-front"></div>
        </div>
        
        <div class="view-section" id="section-side">
          <h3><span class="standard-badge badge-side">侧面</span> 标准视频</h3>
          <div class="standards-grid" id="grid-side"></div>
        </div>
        
        <div class="view-section" id="section-angle">
          <h3><span class="standard-badge badge-angle">斜侧面</span> 标准视频</h3>
          <div class="standards-grid" id="grid-angle"></div>
        </div>
      </div>
    </div>

    <script>
      const alertBox = document.getElementById('alertBox');
      const uploadForm = document.getElementById('uploadForm');
      const videoFile = document.getElementById('videoFile');
      const fileName = document.getElementById('fileName');
      const uploadBtn = document.getElementById('uploadBtn');

      function showAlert(message, type = 'success') {
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
      }

      videoFile.addEventListener('change', () => {
        if (videoFile.files.length > 0) {
          fileName.textContent = videoFile.files[0].name;
          uploadBtn.disabled = false;
        } else {
          fileName.textContent = '未选择文件';
          uploadBtn.disabled = true;
        }
      });

      uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        uploadBtn.disabled = true;
        uploadBtn.textContent = '上传中...';
        
        const formData = new FormData(uploadForm);
        try {
          const res = await fetch('/api/standards', {
            method: 'POST',
            body: formData,
            credentials: 'include'
          });
          const data = await res.json();
          if (res.ok) {
            showAlert('上传成功！', 'success');
            uploadForm.reset();
            fileName.textContent = '未选择文件';
            loadStandards();
          } else {
            showAlert(data.error_message || '上传失败', 'error');
          }
        } catch (err) {
          showAlert('网络错误，请重试', 'error');
        } finally {
          uploadBtn.disabled = false;
          uploadBtn.textContent = '上传';
        }
      });

      async function loadStandards() {
        try {
          const res = await fetch('/api/standards', { credentials: 'include' });
          const standards = await res.json();
          
          const groups = { front: [], side: [], angle: [] };
          standards.forEach(s => {
            if (groups[s.view_angle]) {
              groups[s.view_angle].push(s);
            }
          });
          
          Object.entries(groups).forEach(([view, items]) => {
            const grid = document.getElementById(`grid-${view}`);
            if (items.length === 0) {
              grid.innerHTML = '<div class="empty-state">暂无标准视频</div>';
            } else {
              grid.innerHTML = items.map(s => renderCard(s)).join('');
            }
          });
        } catch (err) {
          showAlert('加载标准视频列表失败', 'error');
        }
      }

      function renderCard(s) {
        const badgeClass = { front: 'badge-front', side: 'badge-side', angle: 'badge-angle' }[s.view_angle] || '';
        const activeBadge = s.is_active ? '<span class="standard-badge badge-active">当前使用</span>' : '';
        const activeClass = s.is_active ? 'active' : '';
        
        return `
          <div class="standard-card ${activeClass}" data-id="${s.id}">
            <video controls preload="auto" poster="" onloadeddata="this.poster=''">
              <source src="/api/standards/${s.id}/video" type="video/mp4">
            </video>
            <div class="standard-info">
              <div class="standard-name">${escapeHtml(s.name)} ${activeBadge}</div>
              <div class="standard-meta">
                <span class="standard-badge ${badgeClass}">${s.view_label}</span>
                <span style="margin-left: 8px;">版本: ${s.version}</span>
              </div>
              <div class="standard-meta">
                上传者: ${escapeHtml(s.uploader_name || '系统')} · ${s.created_at.split('T')[0]}
              </div>
            </div>
            <div class="standard-actions">
              <button class="btn-activate" onclick="activateStandard(${s.id})" ${s.is_active ? 'disabled' : ''}>
                ${s.is_active ? '已激活' : '设为当前'}
              </button>
              <button class="btn-delete" data-id="${s.id}" data-name="${escapeHtml(s.name).replace(/'/g, '&#39;')}">删除</button>
            </div>
          </div>
        `;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
      }

      async function activateStandard(id) {
        if (!confirm('确定要将此视频设为该视角的当前标准吗？')) return;
        
        try {
          const res = await fetch(`/api/standards/${id}/activate`, {
            method: 'POST',
            credentials: 'include'
          });
          const data = await res.json();
          if (res.ok) {
            showAlert(data.message || '激活成功', 'success');
            loadStandards();
          } else {
            showAlert(data.error_message || '操作失败', 'error');
          }
        } catch (err) {
          showAlert('网络错误，请重试', 'error');
        }
      }

      async function deleteStandard(id, name) {
        if (!confirm(`确定要删除标准视频「${name}」吗？此操作不可恢复。`)) return;
        
        try {
          const res = await fetch(`/api/standards/${id}`, {
            method: 'DELETE',
            credentials: 'include'
          });
          const data = await res.json();
          if (res.ok) {
            showAlert('删除成功', 'success');
            loadStandards();
          } else {
            showAlert(data.error_message || '删除失败', 'error');
          }
        } catch (err) {
          showAlert('网络错误，请重试', 'error');
        }
      }

      // 使用事件委托处理删除按钮点击
      document.getElementById('standardsList').addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-delete')) {
          const id = e.target.dataset.id;
          const name = e.target.dataset.name;
          deleteStandard(id, name);
        }
      });

      // 初始加载
      loadStandards();
    </script>
  </body>
</html>
